# Cuts vX.Y.Z tags from Conventional Commits (docs/decisions/0003). Merge the release pull request when a batch is
# worth shipping; SwiftPM resolves the tag.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    uses: Misoto22/ci/.github/workflows/release.yml@3a25c7df20d85291cd9a67f910c9293af1b4b094 # v0.12.0
    with:
      app-client-id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
