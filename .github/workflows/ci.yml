# Build and test AppleKit on the iOS Simulator, watchOS Simulator, and macOS host.
# The token pipeline (tokens/) is Node and runs on Linux.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the toolchain
        run: xcodebuild -version && swift --version
      - name: Test on the macOS host
        run: swift test
      - name: Test on the iOS Simulator, warnings as errors
        run: |
          xcodebuild test -scheme AppleKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Build watchOS-compatible products, warnings as errors
        run: |
          for scheme in MisotoFoundation MisotoTheme MisotoMotion MisotoLayout; do
            xcodebuild build -scheme "$scheme" \
              -destination 'generic/platform=watchOS Simulator' \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          done

  tokens:
    name: Tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tokens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
